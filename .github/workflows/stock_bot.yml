name: Stock Analysis Bot

# Bot chạy tự động theo lịch (giờ Việt Nam = UTC+7, nên giờ cron bên dưới đã trừ đi 7 tiếng).
# Lịch mặc định (có thể sửa lại thoải mái ở phần "cron" bên dưới):
#   - 09:20  giờ VN (02:20 UTC) -> đầu phiên sáng, lấy dữ liệu "hiện tại"
#   - 11:10  giờ VN (04:10 UTC) -> cuối phiên sáng
#   - 14:00  giờ VN (07:00 UTC) -> giữa phiên chiều
#   - 16:00  giờ VN (09:00 UTC) -> sau khi đóng cửa (14:45), để lưu dữ liệu CHỐT phiên vào GitHub
# LƯU Ý (30/09/2026): GitHub Actions không đảm bảo chạy đúng giây/phút đã đặt — cron của
# GitHub thường trễ vài phút (có lúc 10-15 phút) vào giờ cao điểm, đây là giới hạn của
# GitHub chứ không sửa được triệt để từ file này. 4 mốc giờ bên dưới đã được lùi SỚM HƠN vài
# phút so với giờ mong muốn thực tế để bù trừ cho độ trễ đó — nếu vẫn thấy trễ nhiều/ít hơn
# dự kiến, có thể chỉnh lùi/tới thêm ở đây.
# Chỉ chạy các ngày thứ 2 - thứ 6 (1-5 trong cron = Mon-Fri).
on:
  schedule:
    - cron: "20 2 * * 1-5"
    - cron: "10 4 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "0 9 * * 1-5"
  # Cho phép bấm nút "Run workflow" trên GitHub để chạy thủ công bất kỳ lúc nào (giữ thói quen cũ).
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: |
          pip install -r requirements.txt
          # Cài riêng, bỏ qua kiểm tra phụ thuộc (--no-deps) vì gói này tự khai "cần vnstock"
          # trong metadata, mà vnstock đang bị PyPI khóa -> nếu để pip tự giải quyết sẽ lỗi.
          pip install --no-deps vnstock_ezchart

      # vnstock và vnai đang bị PyPI "quarantine" (không pip install được từ PyPI).
      # Dùng tạm bản đã cài sẵn ở máy, đóng gói trong vendor/vnstock_vendor.zip,
      # giải nén ra rồi trỏ PYTHONPATH vào đó để Python import được như bình thường.
      # Khi nào PyPI gỡ quarantine, có thể xoá bước này và thêm lại vnstock/vnai
      # vào requirements.txt như cũ.
      - name: Giải nén thư viện vnstock/vnai (đóng gói sẵn, do PyPI đang quarantine)
        run: |
          mkdir -p vendor_extracted
          unzip -o vnstock_vendor.zip -d vendor_extracted

      - name: Chạy bot phân tích
        env:
          PYTHONPATH: ${{ github.workspace }}/vendor_extracted/vnstock_vendor
          SSI_CLIENT_ID: ${{ secrets.SSI_CLIENT_ID }}
          SSI_API_KEY: ${{ secrets.SSI_API_KEY }}
          SSI_API_SECRET: ${{ secrets.SSI_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GH_HISTORY_TOKEN }}
          GITHUB_REPO: ${{ secrets.GH_HISTORY_REPO }}
          GITHUB_BRANCH: ${{ secrets.GH_HISTORY_BRANCH }}
          HISTORY_GITHUB_PATH: ${{ secrets.HISTORY_GITHUB_PATH }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          VALUATION_SOURCE: ${{ secrets.VALUATION_SOURCE }}
          # Số giây "nghe" streaming SSI để bắt tick giá + khối ngoại trước khi ngắt kết nối.
          # Mặc định trong code là 25s nếu không khai báo dòng này. Tăng lên (vd 60-90) nếu
          # muốn bắt được nhiều sự kiện khối ngoại hơn, đổi lại job chạy lâu hơn tương ứng.
          SSI_STREAM_WAIT_SEC: "60"
          # Toàn bộ danh sách mã bot quét/phân tích mỗi lần chạy (mặc định trong code là 60 mã
          # bên dưới nếu không khai báo dòng này). Muốn thêm mã MỚI (không nằm trong 60 mã gốc),
          # chỉ cần gõ thêm mã đó vào cuối chuỗi, cách nhau bằng dấu phẩy, KHÔNG dấu cách, viết
          # in hoa đúng mã trên sàn (HOSE/HNX/UPCOM). Ví dụ thêm SHB, VIB: nối ",SHB,VIB" vào cuối.
          WATCHLIST: "VPB,VTP,VGC,VHC,ACB,VND,VCG,TCX,STB,SIP,PVT,REE,KBC,PVD,NLG,NT2,PAN,PC1,MBS,MSH,MSN,HDB,HHV,GVR,DPG,DPM,DXG,DDV,BMP,CTR,BSR,BVH,CTG,BID,DCM,DGW,FPT,GAS,GEX,GMD,HAH,HCM,KDH,MBB,MWG,PHR,PNJ,POW,HPG,IDC,PVS,SAB,SSI,TCB,VCB,VHM,VIC,VJC,VCI,VNM"
          # Danh sách mã "ưu tiên theo dõi" (phân tích sâu: RSI/MACD/CCI, định giá, room khối
          # ngoại, tín hiệu MUA/BÁN riêng). Viết mã in hoa, cách nhau bằng dấu phẩy, KHÔNG dấu
          # cách sau dấu phẩy. LƯU Ý: mã ở đây PHẢI có mặt trong WATCHLIST ở trên thì mới có
          # dữ liệu để hiện phần "Mã ưu tiên theo dõi" trong báo cáo.
          PRIORITY_TICKERS: "DCM,TCX,VTP,CTR,VGI"
        run: python stock_analysis_bot.py
