name: OCI Auto Retry Create VM (Free Tier ARM)

# Tự động dò + tạo VM Free Tier ARM (VM.Standard.A1.Flex) mỗi khi Oracle có chỗ trống.
# LƯU Ý QUAN TRỌNG: GitHub Actions KHÔNG đảm bảo chạy đúng tần suất/giờ đã đặt (có thể trễ vài
# đến chục phút vào giờ cao điểm) — cơ hội "bắt được chỗ trống" sẽ THẤP HƠN nhiều so với chạy
# script này liên tục 24/7 trên 1 máy luôn bật. Vẫn dùng được, chỉ là tỉ lệ thành công thấp hơn.
# Mỗi lần workflow chạy, script tự thử lặp lại nhiều lần trong ~10 phút (xem MAX_DURATION_SEC
# trong oci_auto_retry.py), cách nhau 60s/lần — AN TOÀN hơn cho tài khoản so với bản đầu (20s/lần,
# dễ bị Oracle coi là gọi API dồn dập). Script TỰ NHẬN RA khi đã tạo được VM (instance_already_exists)
# và bỏ qua ngay từ đầu job — không cần tắt lịch cron thủ công, nhưng job vẫn được cron kích hoạt
# đều đặn (chỉ chạy vài giây rồi thoát, không tốn thêm phút Actions/API đáng kể).
# SỬA 14/10/2026: script viết lại phần dò — (1) gặp 429 thì chờ tăng dần rồi thử lại, không bỏ lượt;
# (2) máy ARM và 2 máy E2 dự phòng cùng được dò suốt cả lượt chạy, không chỉ 1 lần đầu; (3) thử lần
# lượt cả 3 Fault Domain; (4) dùng API báo cáo chỗ trống để phát hiện chỗ trống sớm hơn.
on:
  schedule:
    # SỬA 02/10/2026: rút từ 20 phút xuống 15 phút/lần. An toàn vì tốc độ gọi API thực tế KHÔNG đổi
    # (vẫn cách nhau RETRY_INTERVAL_SEC=120s/lần bên trong mỗi lượt chạy) — chỉ giảm phần "chết"
    # (không gọi gì) giữa 2 lượt chạy từ 10 phút xuống 5 phút, tăng số lượt dò/ngày.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Chặn 2 lượt chạy chồng lên nhau (phòng trường hợp lượt trước chạy trễ) — nếu lượt mới tới trong
# lúc lượt cũ còn chạy, GitHub sẽ xếp hàng chờ lượt cũ xong hẳn rồi mới chạy lượt mới, không bao giờ
# có 2 tiến trình gọi API cùng lúc.
concurrency:
  group: oci-auto-retry-vm
  cancel-in-progress: false

jobs:
  try-create-vm:
    runs-on: ubuntu-latest
    # Đặt dư ra 2 phút so với MAX_DURATION_SEC=600s (10 phút) để không bị Actions tự ngắt giữa chừng.
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: pip install oci requests

      - name: Dò và tạo VM
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          # Dán NGUYÊN VĂN nội dung file .pem (bao gồm cả dòng -----BEGIN/END PRIVATE KEY-----)
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          OCI_INSTANCE_NAME: "falconthp-vm-bot"
          # SỬA 06/10/2026: sau ~270 lần thử nhiều ngày vẫn "Out of host capacity" ở Singapore (1 AD
          # duy nhất, nổi tiếng khó xin ARM A1) — hạ tiếp từ 2 OCPU/12GB xuống 1 OCPU/6GB. Khẩu phần
          # càng nhỏ, Oracle càng dễ "ghép" vào 1 khe trống hơn là phải tìm liền khối 2 OCPU/12GB.
          # Có thể nâng lại lên 2/12 sau khi đã tạo được VM lần đầu thành công.
          OCI_OCPUS: "1"
          OCI_MEMORY_GB: "6"
          OCI_BOOT_VOLUME_GB: "50"
          # SỬA 10/10/2026: sau 444 lần thử vẫn chưa được ARM — thêm máy DỰ PHÒNG x86 E2.1.Micro
          # (cũng thuộc Always Free, ít bị tranh giành nên gần như luôn tạo được ngay). Script tự
          # thử tạo ĐỦ CẢ 2 máy E2 (đúng hạn mức tối đa Always Free cho shape này) mỗi lượt chạy,
          # máy nào đã có sẵn thì bỏ qua — KHÔNG ảnh hưởng gì tới việc vẫn tiếp tục dò máy ARM ở
          # trên. Đặt "false" nếu không muốn 2 máy x86 dự phòng này nữa.
          ENABLE_E2_FALLBACK: "true"
          # SỬA 11/10/2026: log thật báo lỗi 400 "Shape VM.Standard.E2.1.Micro is not valid for
          # image ***" — OCI_IMAGE_OCID đang dùng là image KIẾN TRÚC ARM (cho máy A1.Flex), không
          # dùng được cho shape x86. BẮT BUỘC tạo thêm 1 secret OCI_E2_IMAGE_OCID chứa OCID của 1
          # image x86_64 (lấy trong Console: Compute > Instances > Create instance > bấm "Change
          # shape" chọn VM.Standard.E2.1.Micro > bấm "Edit" ở mục Image > chọn OS bạn muốn (vd cùng
          # Ubuntu version đang dùng cho máy ARM, bản x86_64) > bấm vào tên image > copy OCID).
          # Thiếu secret này, script tự ĐỘNG TẮT fallback E2 (không lặp lỗi 400 vô ích mỗi lượt).
          OCI_E2_IMAGE_OCID: ${{ secrets.OCI_E2_IMAGE_OCID }}
          MAX_DURATION_SEC: "600"
          # SỬA 01/10/2026: 60s vẫn dính 429 (giới hạn tốc độ) khá thường xuyên với riêng API
          # LaunchInstance — tăng lên 120s/lần cho an toàn hơn, đổi lại mỗi lượt chạy còn ~5 lần thử
          # (thay vì ~10) trong cùng 600s.
          RETRY_INTERVAL_SEC: "120"
          # SỬA 14/10/2026: nhịp "hỏi xem còn chỗ không" bằng API báo cáo chỗ trống (Compute Capacity
          # Report — API rẻ, không tạo gì nên ít bị 429 hơn LaunchInstance). Thấy Fault Domain nào báo
          # AVAILABLE thì script bắn LaunchInstance ngay vào đúng FD đó. LaunchInstance "bắn thử" định
          # kỳ vẫn giữ nhịp RETRY_INTERVAL_SEC=120s như cũ, không tăng tần suất gọi API tạo máy.
          CHECK_INTERVAL_SEC: "45"
          # Dùng lại đúng secret Telegram đã có sẵn từ 2 bot kia, để báo ngay khi tạo VM thành công.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python oci_auto_retry.py
